# M0 CI (plan section 6.5): clang-format lint + CMake (VS generator) +
# Release build + CTest. windows-latest ships a stock VS 2022 + CMake +
# Python, so no explicit generator or extra action is needed here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 19 (matches .clang-format intent)
        run: python -m pip install --disable-pip-version-check "clang-format==19.1.0"
      - name: clang-format check
        shell: pwsh
        run: |
          clang-format --version
          $files = Get-ChildItem src, tests -Recurse -Include *.cpp, *.h
          $bad = @()
          foreach ($f in $files) {
            clang-format --dry-run --Werror --style=file $f.FullName
            if ($LASTEXITCODE -ne 0) { $bad += $f.FullName }
          }
          Write-Host "checked $($files.Count) files"
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "needs formatting: $_" }
            throw "$($bad.Count) file(s) are not clang-formatted"
          }

  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B out -A x64
      - name: Build and test (verify.ps1, strict mode)
        shell: pwsh
        # tools/verify.ps1 builds, kills stray test processes, captures every ctest
        # run to out/test-logs/, and with -NoRetry treats the first failure as real
        # (the retry exists for local runs, where a transient glitch should not look
        # like a regression; CI should never retry).
        run: ./tools/verify.ps1 -NoRetry
