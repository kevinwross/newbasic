# Build, test and lint on Windows and Linux. Linux gets a windowed (SDL2) job
# and a dependency-free console-only job, so both configurations stay honest.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 19
        run: python -m pip install --disable-pip-version-check "clang-format==19.1.0"
      - name: clang-format check
        run: |
          clang-format --version
          mapfile -t files < <(find src tests -type f \( -name '*.cpp' -o -name '*.h' \))
          echo "checked ${#files[@]} files"
          clang-format --dry-run --Werror --style=file "${files[@]}"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B out -A x64
      - name: Build and test (strict mode)
        shell: pwsh
        run: ./tools/verify.ps1 -NoRetry

  linux:
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ clang libsdl2-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --timeout 180 --output-on-failure
      - name: Headless SDL smoke
        env:
          SDL_VIDEODRIVER: dummy
        run: ./build/tests/lwbasic-tests "[.gpu]"

  linux-console-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
      - name: Configure without SDL
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLWBASIC_WINDOW_SDL=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --timeout 180 --output-on-failure
